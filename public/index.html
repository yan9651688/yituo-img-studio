<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" type="image/png" href="/assets/logo.png?v=2" />
  <title>Y Data Img Studio</title>
  <link rel="stylesheet" href="/style.css?v=24" />
</head>
<body>
  <div id="app">
    <!-- 侧边栏 -->
    <aside class="sidebar">
      <a class="logo" href="/" data-nav="/" title="Y Data Img Studio"><img src="/assets/logo.png?v=2" alt="Y Data Img Studio" /></a>
      <nav class="side-nav" id="sideNav">
        <a href="/" data-nav="/">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          <span>首页</span>
        </a>
        <a href="/generate" data-nav="/generate">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4V2m0 20v-2M9.5 4.6 8 3m8 18-1.5-1.6M4.6 9.5 3 8m18 8-1.6-1.5M2 15h2m16 4h2"/><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/></svg>
          <span>工作台</span>
        </a>
        <a href="/assets" data-nav="/assets">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.9-3.9a2 2 0 0 0-2.8 0L6 19.5"/></svg>
          <span>资产</span>
        </a>
        <a href="/logs" data-nav="/logs">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="9"/></svg>
          <span>日志</span>
        </a>
        <a href="/docs" data-nav="/docs">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4a2 2 0 0 0-2-2H6.5A2.5 2.5 0 0 0 4 4.5v15Z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>
          <span>文档</span>
        </a>
        <a href="/about" data-nav="/about">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/></svg>
          <span>关于</span>
        </a>
      </nav>
      <div class="side-bottom">
        <button class="side-btn" id="themeBtn" title="切换暗色">
          <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
          <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <span class="theme-label">暗色模式</span>
        </button>
        <button class="side-btn" id="loginLink" style="display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="m10 17 5-5-5-5M15 12H3"/></svg>
          <span>登录</span>
        </button>
        <a class="side-btn" href="/settings" data-nav="/settings" id="settingsLink" style="display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
          <span>设置</span>
        </a>
      </div>
    </aside>

    <!-- 主区域 -->
    <main id="main" class="main"></main>
  </div>

  <!-- 登录 / 注册弹窗 -->
  <div class="modal-mask" id="authModal" hidden>
    <div class="modal auth-modal">
      <button class="modal-close" id="authClose">✕</button>
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">登录</button>
        <button class="auth-tab" data-tab="register">注册</button>
      </div>
      <form id="loginForm" class="auth-form">
        <label>用户名<input name="username" autocomplete="username" placeholder="用户名" required /></label>
        <label>密码<input name="password" type="password" autocomplete="current-password" placeholder="密码" required /></label>
        <div class="form-err" id="loginErr"></div>
        <button class="btn primary block" type="submit">登录</button>
        <p class="auth-hint">注册后在「设置」绑定 Y Data 密钥即可开始生图。</p>
      </form>
      <form id="registerForm" class="auth-form" hidden>
        <label>用户名<input name="username" autocomplete="username" placeholder="2-24 位中英文 / 数字" required /></label>
        <label>密码<input name="password" type="password" autocomplete="new-password" placeholder="至少 6 位" required /></label>
        <label>确认密码<input name="password2" type="password" autocomplete="new-password" placeholder="再输入一次" required /></label>
        <div class="slider-captcha" id="sliderBox">
          <div class="slider-track" id="sliderTrack">
            <canvas id="sliderCanvas" width="320" height="180"></canvas>
            <div class="slider-pill" id="sliderPill">拖动下方滑块完成拼图</div>
            <button class="slider-refresh" id="sliderRefresh" type="button" title="换一张">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
            </button>
            <div class="slider-piece" id="sliderPiece"><canvas id="pieceCanvas" width="64" height="64"></canvas></div>
            <div class="slider-loading" id="sliderLoading"><span class="spinner-sm"></span></div>
          </div>
          <div class="slider-bar" id="sliderBar">
            <div class="slider-fill" id="sliderFill"></div>
            <span class="slider-tip" id="sliderTip">向右拖动滑块填充拼图</span>
            <div class="slider-thumb" id="sliderThumb">
              <svg class="thumb-arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m11 7-5 5 5 5M18 7l-5 5 5 5"/></svg>
              <svg class="thumb-ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
            </div>
          </div>
        </div>
        <div class="form-err" id="registerErr"></div>
        <button class="btn primary block" type="submit">注册并登录</button>
      </form>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
  <script src="/app.js?v=33"></script>
</body>
</html>
